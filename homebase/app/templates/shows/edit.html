{% extends "base.html" %}
{% import "components/macros.html" as c %}
{% block title %}Edit Show — Top Spot Judging{% endblock %}
{% block content %}
<div class="page-header">
  <span class="page-header__eyebrow">{{ show.name }}</span>
  <h1>Edit Show</h1>
</div>

{{ c.dashboard_tabs(show, "edit_show") }}

<div class="card" style="max-width: 640px;">
  <form method="post" action="/shows/{{ show.id }}" class="stack">
    <div class="field">
      <label class="field__label" for="name">Show Name</label>
      <input class="input" id="name" name="name" type="text" value="{{ show.name }}" required>
    </div>
    <div class="row" style="align-items: flex-start;">
      <div class="field">
        <label class="field__label" for="event_date">Show Date</label>
        <input class="input" id="event_date" name="event_date" type="date" value="{{ show.event_date.isoformat() }}" required>
      </div>
      <div class="field">
        <label class="field__label" for="location">Location</label>
        <input class="input" id="location" name="location" type="text" value="{{ show.location or '' }}">
      </div>
    </div>
    <div class="field">
      <label class="field__label" for="notes">Notes</label>
      <textarea class="textarea" id="notes" name="notes">{{ show.notes or '' }}</textarea>
    </div>
    <div class="row">
      {{ c.button("Save changes", "primary", type="submit") }}
      <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
