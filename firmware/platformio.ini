; Top Spot Judging — handheld firmware
;
; Hardware: Elecrow CrowPanel ESP32 Display 7" (DIS08070H V3.0)
;   MCU:     ESP32-S3-WROOM-1-N4R8 (4MB Quad flash, 8MB Octal PSRAM)
;   Display: 800x480 RGB parallel LCD (EK9716BD3-class controller)
;   Touch:   GT911 capacitive, I2C
;   Camera:  Arducam Mega 5MP SPI Autofocus, on a dedicated second SPI bus
;   SD:      onboard microSD, SPI
; See ../DECISIONS.md and include/pins.h for the full pin-reservation
; rationale and the sourcing behind every pin/timing value below — none of
; it is guessed; see the citations in pins.h.
;
; OFFLINE REPRODUCIBILITY: every dependency below is pinned to an exact
; version/tag. Run `pio pkg install` (or just build once) while you have
; internet — PlatformIO caches everything under .pio/, and every build
; after that works with zero network access, matching CONTEXT.md's
; offline-first constraint for the whole system.

[platformio]
default_envs = handheld

; ---------------------------------------------------------------------------
; Shared base config — every environment below extends this.
; ---------------------------------------------------------------------------
[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; esp32-s3-devkitc-1 is a generic ESP32-S3 board definition, NOT specific to
; the CrowPanel — Elecrow doesn't publish a PlatformIO board JSON for the
; DIS08070H, so every board_build.* line below overrides the generic
; devkit's assumptions to match the real ESP32-S3-WROOM-1-N4R8 module.
board_build.arduino.memory_type = qio_opi   ; N4R8 = Quad flash, Octal PSRAM
board_build.psram_type = opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
; partitions.csv (F4): a custom table derived from the stock huge_app.csv
; this project used through F3 — same 3MB app0, same nvs/otadata/coredump,
; but the old unused spiffs allocation (photos live on the SD card, never
; internal flash) is reclaimed into `vehicle_seed`, the flash-mapped
; vehicle make/model database — see partitions.csv's own header and
; ../DECISIONS.md's F4 entry for the full reclaim math.
board_build.partitions = partitions.csv

; Registers `pio run -t upload-vehicle-seed` — writes firmware/data/
; vehicle_seed.bin straight to the vehicle_seed partition, independent of
; a full firmware upload. See tools/upload_vehicle_seed.py and
; DECISIONS.md's F4 entry.
extra_scripts = tools/upload_vehicle_seed.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Serial console is the classic UART0-via-bridge-chip path (GPIO43/44 on
; this board), NOT native USB CDC — GPIO19/20 (the ESP32-S3's fixed native
; USB pins) are permanently wired to GT911 touch I2C on this board, so
; native USB CDC is not a safe option here. This also means: once the
; Arducam is soldered onto GPIO43/44 per the hardware contract, this
; board's normal serial console goes with it — see include/pins.h.
; -Isrc: lets subsystem code cross-include by path, e.g. camera.cpp's
; #include "storage/sd_card.h" -- PlatformIO auto-adds include/, but NOT
; src/ itself, to the search path.
; LV_CONF_INCLUDE_SIMPLE: makes lvgl.h do a plain #include "lv_conf.h"
; instead of a relative ../../lv_conf.h — our copy lives in include/,
; already on PlatformIO's default include path, alongside pins.h.
; LV_LVGL_H_INCLUDE_SIMPLE: the converted font .c files (src/ui/fonts/)
; do `#include "lvgl.h"` instead of `#include "lvgl/lvgl.h"` when this is
; set — matches how PlatformIO's LDF exposes the lvgl library's own
; include path.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Isrc
    -Wall

; Arducam_Mega isn't indexed on the PlatformIO registry under a name that
; matches the official vendor release, so it's pinned directly against
; ArduCAM's own GitHub repo at the exact verified tag (v3.0.0) instead of
; going through a third-party registry mirror. LVGL is pinned to the last
; v8 release (v9 changed enough of the widget/font API to be a separate
; migration, not something to take on inside this task) — see
; include/lv_conf.h and DECISIONS.md for the rest of the LVGL integration
; writeup.
; ArduinoJson: local storage (show cache, settings, the finished-car
; queue) is all JSON-on-SD — see src/storage/. bblanchon/ArduinoJson is
; the de facto standard for this on Arduino/ESP32; no reason to hand-roll
; a parser for something this well-covered.
lib_deps =
    lovyan03/LovyanGFX@1.2.28
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@6.21.5
    https://github.com/ArduCAM/Arducam_Mega.git#v3.0.0

; ---------------------------------------------------------------------------
; Bring-up environments — ONE subsystem each, deliberately not integrated.
; Each excludes src/main.cpp AND every OTHER bringup_*.cpp, keeping exactly
; one setup()/loop() in the build. Flash each in isolation and verify on
; real hardware before moving to the next; see firmware/README.md for what
; to physically check at each step.
; ---------------------------------------------------------------------------

[env:bringup-display]
build_src_filter = +<*> -<main.cpp> -<bringup/> +<bringup/bringup_display.cpp>

[env:bringup-sd]
build_src_filter = +<*> -<main.cpp> -<bringup/> +<bringup/bringup_sd.cpp>

[env:bringup-camera]
build_src_filter = +<*> -<main.cpp> -<bringup/> +<bringup/bringup_camera.cpp>

; UI foundation bring-up: LVGL + the theme/component/screen-manager layer,
; boots straight to the debug menu -> component demo screen (requirement 6).
; Needs only the display + touch + SD (SD holds the theme preference file,
; see ui/theme.cpp) — no camera dependency, so this can be flashed and
; checked well before the camera is soldered on.
[env:bringup-ui]
build_src_filter = +<*> -<main.cpp> -<bringup/> +<bringup/bringup_ui.cpp>

; Local storage smoke test: settings, show cache, sync state, the
; finished-car queue, drafts — see storage/*.h and TESTING.md for the
; real physical battery-pull crash-safety procedure this complements.
[env:bringup-storage]
build_src_filter = +<*> -<main.cpp> -<bringup/> +<bringup/bringup_storage.cpp>

; The real judging flow (F3) end to end — Home through Review. See
; bringup/bringup_judging.cpp and ../TESTING.md.
[env:bringup-judging]
build_src_filter = +<*> -<main.cpp> -<bringup/> +<bringup/bringup_judging.cpp>

; Battery bring-up is intentionally NOT wired up yet — this board has no
; documented battery-voltage ADC pin (only a JST charge-circuit connector),
; and inventing a pin here is exactly what we were told not to do. See
; src/power/battery.h and DECISIONS.md. Once a pin + divider are confirmed,
; add:
;   [env:bringup-battery]
;   build_src_filter = +<*> -<main.cpp> -<bringup/> +<bringup/bringup_battery.cpp>

; ---------------------------------------------------------------------------
; Integrated firmware target (grows in later phases)
; ---------------------------------------------------------------------------
[env:handheld]
build_src_filter = +<*> -<bringup/>
